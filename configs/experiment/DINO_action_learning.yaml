# @package _global_

defaults:
  - override /data: ego_trajectory_dataset
  - override /callbacks: callbacks_action_training
  - override /trainer: deepspeed2
  - override /logger: many_loggers
  - override /paths: jeanzay_nuplan
  - override /scheduler: warmup_stable_drop

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters


trainer:
  max_epochs: 1
  # clip gradients' global norm to using gradient_clip_algorithm='norm' by default
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  log_every_n_steps: 5
  default_root_dir: ${paths.output_dir}/${name}/

scheduler:
  warmup_iter: 75 # 1% ~ end_iter * 0.01
  end_iter: 7251 # (len_dataset - 1) // BATCH_SIZE * nb_epochs
  drop_iter: 725 # 10%

data:
  nuplan_tokens_rootdir: null
  nuplan_train_pickle_path: ${paths.nuplan.train_pickle}
  nuplan_val_pickle_path: ${paths.nuplan.val_pickle}
  nuplan_images_rootdir: ${paths.nuplan.images_rootdir}
  nuplan_images_transform: "nuplan:default"
  nuscenes_tokens_rootdir: null
  nuscenes_train_pickle_path: ${paths.nuscenes.train_pickle}
  nuscenes_val_pickle_path: ${paths.nuscenes.val_pickle}
  nuscenes_images_rootdir: ${paths.nuscenes.images_rootdir}
  nuscenes_images_transform: "nuscenes:default"
  sequence_length: 3
  action_length: 6

model:
  _target_: vam.action_expert.ActionLearning
  _recursive_: false
  flow_sampling: beta
  flow_alpha: 1.5
  flow_beta: 1.0
  batch_key: image
  vam_conf:
    _target_: vam.action_expert.DINO_action_model.DINOActionModel
    _recursive_: false
    context_length: ${data.sequence_length}
    num_inference_steps: 10
    flow_sig_min: 0.001
    final_action_clip_value: null
    action_scaling: 70.
    nb_tokens_per_timesteps: 720 # 280 / 14 * 504 / 14
    dino_config:
      _target_: vam.action_expert.DINO_action_model.DINOBackbone
      model_name: "dinov2_vitl14_reg"
    action_mup_base_shapes: null
    action_config:
      _target_: vam.action_expert.MupActionExpert
      embedding_dim: 192
      attention_dim: 1024
      action_dim: 2
      action_horizon: ${data.action_length}
      number_high_level_command: 3
      dim_heads: 128
      nb_layers: 24
      init_std: 0.01
  optimizer_conf:
    lr: 0.0001
    weight_decay: 1e-8
    betas: [0.9, 0.95]
    eps: 1e-08
    decoupled_wd: True
